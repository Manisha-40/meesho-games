<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#570D48">
<title>Meesho Games · working prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="beams" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="sparks" aria-hidden="true"></div>
<div class="pennants" aria-hidden="true"></div>
<div class="stage">
  <aside class="side left" aria-label="Pick a shopper">
    <div class="brand"><span class="bdot"></span>Meesho Games<b>live prototype</b></div>
    <h1>Pick a <em>shopper</em></h1>
    <p class="lead">Four kinds of Meesho shoppers. Tap one and the phone switches on in their language, with the products they would actually look for.</p>
    <div class="who" id="who"></div>
    <div class="profile" id="profile"></div>
    <div class="ctl"><button class="side-btn" data-dev="lang">Change language</button><button class="side-btn" data-dev="reset">Reset demo</button></div>
  </aside>
  <div class="phone-wrap" id="wrap">
    <div class="tvglow" aria-hidden="true"></div>
    <div class="phone" id="phone">
      <div id="app"></div>
      <div id="layer"></div>
      <div id="fx" aria-live="polite"></div>
      <div id="standby"><div class="pw"><i></i></div><b>Pick a shopper</b><span>on the left to switch this phone on</span></div>
    </div>
  </div>
  <aside class="side right" aria-label="What each side gets">
    <div id="rbody"></div>
  </aside>
</div>
<footer class="foot">
  <span class="pill"><img src="img/gb.png" alt="Gameberry Labs"></span>
  <span class="x">×</span>
  <span class="pill"><img src="img/isb.svg" alt="Indian School of Business" style="height:34px"></span>
  <span class="txt">Placement assignment by <b>Manisha Jena</b> · PGID 62610545 · Grow DAU by 10%</span>
</footer>
<script src="data.js"></script>
<script src="art.js"></script>
<script src="core.js"></script>
<script src="shop.js"></script>
<script src="dice.js"></script>
<script src="ludo.js"></script>
<script src="snakes.js"></script>
<script src="housie.js"></script>
<script src="games.js"></script>
<script src="rewards.js"></script>
<script src="panel.js"></script>
<script src="app.js"></script>
</body>
</html>
